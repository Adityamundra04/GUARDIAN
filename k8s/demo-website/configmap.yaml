apiVersion: v1
kind: ConfigMap
metadata:
  name: guardian-demo-html
  namespace: default
  labels:
    app: guardian-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guardian Demo Website</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
            }
            
            .container {
                text-align: center;
                padding: 40px;
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                border: 1px solid rgba(255, 255, 255, 0.18);
                max-width: 600px;
            }
            
            h1 {
                font-size: 3em;
                margin-bottom: 20px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }
            
            .shield {
                font-size: 5em;
                margin-bottom: 20px;
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.1); }
            }
            
            p {
                font-size: 1.2em;
                line-height: 1.6;
                margin-bottom: 15px;
            }
            
            .status {
                display: inline-block;
                padding: 10px 20px;
                background: rgba(76, 175, 80, 0.3);
                border-radius: 25px;
                margin-top: 20px;
                font-weight: bold;
            }
            
            .status::before {
                content: "●";
                color: #4CAF50;
                margin-right: 8px;
                animation: blink 1.5s infinite;
            }
            
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }
            
            .info {
                margin-top: 30px;
                padding: 20px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 10px;
                font-size: 0.9em;
            }
            
            .info p {
                margin: 10px 0;
                font-size: 1em;
            }
            
            code {
                background: rgba(0, 0, 0, 0.3);
                padding: 2px 8px;
                border-radius: 4px;
                font-family: 'Courier New', monospace;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="shield">🛡️</div>
            <h1>Guardian Demo</h1>
            <p>AI-Powered Kubernetes Monitoring</p>
            <p>This website is being monitored by Guardian</p>
            <div class="status">System Operational</div>
            
            <div class="info">
                <p><strong>Pod Name:</strong> <code id="hostname">Loading...</code></p>
                <p><strong>Namespace:</strong> <code>default</code></p>
                <p><strong>Service:</strong> <code>guardian-demo-website</code></p>
                <p><strong>Port:</strong> <code>30080</code></p>
            </div>
        </div>
        
        <script>
            // Display hostname (pod name)
            fetch('/hostname.txt')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('hostname').textContent = data || 'guardian-demo-website';
                })
                .catch(() => {
                    document.getElementById('hostname').textContent = 'guardian-demo-website';
                });
        </script>
    </body>
    </html>
  
  hostname.txt: |
    guardian-demo-website
