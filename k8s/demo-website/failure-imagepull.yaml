apiVersion: v1
kind: Pod
metadata:
  name: demo-imagepull-failure
  namespace: default
  labels:
    app: guardian-demo
    test: imagepull
spec:
  containers:
  - name: broken-image
    image: nginx:this-tag-does-not-exist-12345
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
  restartPolicy: Always
