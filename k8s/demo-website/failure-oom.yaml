apiVersion: v1
kind: Pod
metadata:
  name: demo-oom-failure
  namespace: default
  labels:
    app: guardian-demo
    test: oom
spec:
  containers:
  - name: memory-hog
    image: polinux/stress:latest
    command: ["stress"]
    args:
    - "--vm"
    - "1"
    - "--vm-bytes"
    - "256M"
    - "--vm-hang"
    - "1"
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"  # Will exceed this limit
        cpu: "200m"
  restartPolicy: Always
