apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-demo-website
  labels:
    app: guardian-demo-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardian-demo-website
  template:
    metadata:
      labels:
        app: guardian-demo-website
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
